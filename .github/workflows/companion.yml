name: Basel Companion Android Build
on:
  push:
    branches: [basel-open-source-mvp]
    paths:
      - 'open-source/android_companion/**'
      - '.github/workflows/companion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: open-source/android_companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BaselCompanion-Android-Debug
          path: open-source/android_companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
