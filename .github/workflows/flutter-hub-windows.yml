name: Flutter Desktop Hub Windows Build

on:
  push:
    branches:
      - basel-open-source-mvp
    paths:
      - 'open-source/flutter_hub/**'
      - '.github/workflows/flutter-hub-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: open-source/flutter_hub
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows runner
        run: flutter create --platforms=windows --project-name basel_desktop_hub .
      - name: Remove generated sample test
        shell: pwsh
        run: |
          if (-not (git ls-files -- test/widget_test.dart)) {
            Remove-Item test/widget_test.dart -ErrorAction SilentlyContinue
          }
      - name: Dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze lib
      - name: Desktop layout unit tests
        run: flutter test
      - name: Compile Windows app
        run: flutter build windows --release
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaselDesktopHub-Windows
          path: open-source/flutter_hub/build/windows/x64/runner/Release/
          if-no-files-found: error
